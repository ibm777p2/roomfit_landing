services:
  - type: web
    name: roomfit-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Every origin the frontend is served from, comma separated, no trailing
      # slash. See the domain guardrail in CLAUDE.md.
      - key: ALLOWED_ORIGINS
        sync: false
